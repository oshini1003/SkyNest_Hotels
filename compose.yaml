name: skynest-docker

x-backend-image: &backend-image
  image: skynest-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile

x-database-environment: &database-environment
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: SkyNest_Integration_Docker
  DB_USER: skynest_app
  DB_PASSWORD: ${DB_PASSWORD:?Run node docker/setup.cjs first}
  TZ: Asia/Colombo

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run node docker/setup.cjs first}
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Colombo
    command: ["--default-time-zone=+05:30"]
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [database]
    healthcheck:
      # TCP is unavailable during the image's temporary first-boot server.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  db-init:
    <<: *backend-image
    restart: "no"
    init: true
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *database-environment
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run node docker/setup.cjs first}
    command: ["node", "docker/initialize.cjs"]
    depends_on:
      db:
        condition: service_healthy
    networks: [database]

  backend:
    <<: *backend-image
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *database-environment
      NODE_ENV: production
      PORT: "5000"
      JWT_SECRET: ${JWT_SECRET:?Run node docker/setup.cjs first}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Run node docker/setup.cjs first}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080},http://127.0.0.1:${WEB_PORT:-8080}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks: [application, database]
    healthcheck:
      test: ["CMD", "node", "docker/healthcheck.cjs"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [application]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:

networks:
  application:
  database:
    internal: true
